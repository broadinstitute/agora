name: 'Agora unit tests'

on:
  workflow_dispatch: #Manual trigger from GitHub UI
  push:
    branches: [ develop ]
    paths-ignore: [ '**.md' ]
  merge_group:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3 # Checkout the Agora repo
      - uses: sbt/setup-sbt@v1
      - name: Git secrets setup
        run: |
          git clone https://github.com/awslabs/git-secrets.git ~/git-secrets
          cd ~/git-secrets
          git checkout ad82d68ee924906a0401dfd48de5057731a9bc84
          sudo make install
        shell: bash
      - name: Secrets check
        run: |
          # git-secrets calls an undefined `say` to print status messages. Provide it as a script rather than a
          # symlink to `echo`: multicall coreutils binaries (e.g. uutils) refuse to run under another name.
          printf '#!/bin/sh\necho "$@"\n' | sudo tee /usr/local/bin/say > /dev/null
          sudo chmod +x /usr/local/bin/say
          ./minnie-kenny.sh --force
          git secrets --scan-history
        shell: bash
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
